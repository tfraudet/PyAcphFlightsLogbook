# Logbook global settings
[logbook]
; OGN devices database source: could be local or remote
ognddb = local
; Airport codes database source: could be local or remote
acdb = local
; persistence could be MySQL or JSON or PostgreSQL
persistence = PostgreSQL
; number of days we keep logbook entry in the database
purge = 30

# APRS server connection settings
[aprs]
user = 
passcode = 
filter = r/45.5138/3.2661/400

# Database settings
[database]
database = ${DB_NAME}
user = ${DB_USER}
password = ${DB_PASSWORD}
host = ${DB_HOST}
port = ${DB_PORT}

# Logging configuration
[loggers]
keys=root,main,logbook,pdo_engine,airport_db

[handlers]
keys=consoleHandler,rotatingFileHandler,slackHandler

[formatters]
keys=acphFormatter,acphSlackFormatter

[formatter_acphFormatter]
format=[%(asctime)s] %(name)s.%(levelname)s: %(message)s
datefmt=

[formatter_acphSlackFormatter]
format=%(message)s
datefmt=
class=slack_logger.SlackFormatter

# for production env, remove the consoleHandler
[logger_root]
level=NOTSET
handlers=rotatingFileHandler,slackHandler

[logger_main]
level=DEBUG
handlers=rotatingFileHandler,slackHandler
propagate=0
qualname=acph.main

[logger_logbook]
level=DEBUG
handlers=rotatingFileHandler,slackHandler
propagate=0
qualname=acph.class_flights_logbook

[logger_pdo_engine]
level=DEBUG
handlers=rotatingFileHandler,slackHandler
propagate=0
qualname=acph.class_flights_logbook_pdo

[logger_airport_db]
level=DEBUG
handlers=rotatingFileHandler,slackHandler
propagate=0
qualname=acph.class_airport_db

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=acphFormatter
args=(sys.stdout,)

[handler_rotatingFileHandler]
class=handlers.TimedRotatingFileHandler
level=INFO
formatter=acphFormatter
# args=(filename, when, interval, backupCount)
args=('./logs/acph-aprs.log', 'midnight', 1, 7)

[handler_slackHandler]
class=slack_logger.SlackHandler
level=WARNING
formatter=acphSlackFormatter
args=('${SLACK_WEBHOOK_URL}',)

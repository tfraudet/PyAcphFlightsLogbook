# Logbook global settings
[logbook]
; OGN devices database source: could be local or remote
ognddb = local
; Airport codes database source: could be local or remote
acdb = local
; persistence could be MySQL, JSON or PostgreSQL
persistence = PostgreSQL
; number of days we keep logbook entry in the database
purge = 30

# PosgreSQL Database
[database]
database = 
user = 
password =
host = database
port = 5432

# Logging configuration
# for production env, remove the consoleHandler
[loggers]
keys=root,main,logbook,pdo_engine,airport_db,ogn_db

[handlers]
keys=consoleHandler,rotatingFileHandler,slackHandler
; keys=consoleHandler,fileHandler,slackHandler

[formatters]
keys=acphFormatter,acphSlackFormatter

[logger_root]
level=NOTSET
handlers=consoleHandler,rotatingFileHandler

[logger_main]
level=INFO
handlers=consoleHandler,rotatingFileHandler
propagate=0
qualname=acph.main

[logger_logbook]
level=INFO
handlers=consoleHandler,rotatingFileHandler
propagate=0
qualname=acph.class_flights_logbook

[logger_pdo_engine]
level=WARNING
handlers=consoleHandler,rotatingFileHandler
propagate=0
qualname=acph.class_flights_logbook_pdo

[logger_airport_db]
level=INFO
handlers=consoleHandler,rotatingFileHandler
propagate=0
qualname=acph.class_airport_db

[logger_ogn_db]
level=INFO
handlers=consoleHandler,rotatingFileHandler
propagate=0
qualname=acph.class_ogn_db

[formatter_acphFormatter]
format=[%(asctime)s] %(name)s.%(levelname)s: %(message)s
datefmt=

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=acphFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=acphFormatter
args=('./logs/api-server.log',)

[handler_rotatingFileHandler]
class=handlers.TimedRotatingFileHandler
level=INFO
formatter=acphFormatter
; args=(filename='./logs/acph-aprs.log', when='midnight', interval=7)
args=('./logs/api-server.log', 'midnight', 7)

[formatter_acphSlackFormatter]
format=%(message)s
datefmt=
class=slack_logger.SlackFormatter

[handler_slackHandler]
class=slack_logger.SlackHandler
level=CRITICAL
formatter=acphSlackFormatter
args=('WEBHOOK_URL',)
